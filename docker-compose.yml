name: ddiver

services:
  ddiver:
    build:
      context: .
      args:
        # Set by deploy.sh so the image can say which commit it is; `unknown` when built by
        # hand, which is honest.
        GIT_SHA: ${GIT_SHA:-unknown}
    image: ddiver:latest
    container_name: ddiver
    env_file: .env
    environment:
      DATA_DIR: /data
    volumes:
      - ./data:/data
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    mem_limit: 512m
    cpus: 1.0
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
