# What is worth waking up for.
#
# Two things about the shape of these rules, both learned by running them against a real
# Grafana rather than by reading the docs:
#
#   noDataState: OK      — the default is NoData, which *alerts*. Every rule here is a filter
#                          that returns an empty vector on a healthy system, so the defaults
#                          send five alarms a day saying the session is invalid when it is not.
#   == bool 0            — a PromQL comparison is a *filter*: it keeps the sample and its
#                          original value. `ddiver_listener_connected == 0` and `< 1` both
#                          return a sample whose value is 0 when the listener is down, and
#                          Grafana reads 0 as Normal — so neither can ever fire. `bool` turns
#                          the comparison into 1 or 0, which is what a condition needs.
#                          `== 1`, `> 500` and `> 0` are fine: their true case is non-zero
#                          already.
#
# Note what is NOT here: "the whole machine is down". Grafana lives on the same box as ddiver,
# so it cannot report its own funeral. That is what PING_URL and an external dead-man's switch
# are for — see the observability section of the README.
apiVersion: 1

groups:
  - orgId: 1
    name: ddiver
    folder: ddiver
    interval: 1m
    rules:
      - uid: ddiver-absent
        title: ddiver is not reporting
        condition: absent
        for: 5m
        noDataState: OK
        execErrState: Error
        annotations:
          summary: No metrics scraped for five minutes. The process is gone, or Prometheus cannot reach it.
        labels: {severity: critical}
        data:
          - refId: absent
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: ddiver-prometheus
            model:
              expr: absent(ddiver_up)
              instant: true
              refId: absent

      - uid: ddiver-needs-login
        title: The listener needs ddiver login
        condition: degraded
        for: 2m
        noDataState: OK
        execErrState: Error
        annotations:
          summary: The Telegram session is invalid. Restarting will not help — run `ddiver login`.
        labels: {severity: critical}
        data:
          - refId: degraded
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: ddiver-prometheus
            model:
              expr: ddiver_degraded == 1
              instant: true
              refId: degraded

      - uid: ddiver-disconnected
        title: The listener has been disconnected
        condition: down
        for: 10m
        noDataState: OK
        execErrState: Error
        annotations:
          summary: The user session's transport has been down for ten minutes. Messages are being missed.
        labels: {severity: warning}
        data:
          - refId: down
            relativeTimeRange: {from: 900, to: 0}
            datasourceUid: ddiver-prometheus
            model:
              expr: ddiver_listener_connected == bool 0
              instant: true
              refId: down

      - uid: ddiver-delivery-stuck
        title: Nothing is getting delivered
        condition: stuck
        for: 10m
        noDataState: OK
        execErrState: Error
        annotations:
          summary: Notifications are failing and none are arriving. Check BOT_TOKEN and `docker logs ddiver`.
        labels: {severity: critical}
        data:
          - refId: stuck
            relativeTimeRange: {from: 1800, to: 0}
            datasourceUid: ddiver-prometheus
            model:
              # The listener half has a supervisor, a degraded gauge and an owner
              # notification; the half that actually delivers has none of that. A revoked
              # BOT_TOKEN raises an error no branch in _send handles, so every notification
              # is marked failed and never retried — silently, because the only thing that
              # would have told you is the bot that just died. `increase` rather than `rate`:
              # a quiet chat produces one failure every twenty minutes, and a rate over five
              # falls back to zero between them and never completes a `for`.
              expr: >-
                increase(ddiver_delivery_failed_total[15m]) > 0
                and
                increase(ddiver_delivery_delivered_total[15m])
                  + increase(ddiver_delivery_digested_total[15m]) == 0
              instant: true
              refId: stuck

      - uid: ddiver-queue-backed-up
        title: Notifications are piling up
        condition: queued
        for: 15m
        noDataState: OK
        execErrState: Error
        annotations:
          summary: More than 500 notifications have been queued for fifteen minutes. Check for flood waits or a blocked bot.
        labels: {severity: warning}
        data:
          - refId: queued
            relativeTimeRange: {from: 1200, to: 0}
            datasourceUid: ddiver-prometheus
            model:
              expr: ddiver_delivery_queued > 500
              instant: true
              refId: queued

      - uid: ddiver-rules-timing-out
        title: A rule keeps timing out
        condition: timeouts
        for: 10m
        noDataState: OK
        execErrState: Error
        annotations:
          summary: Regex timeouts are happening continuously. A rule is about to be disabled automatically.
        labels: {severity: warning}
        data:
          - refId: timeouts
            relativeTimeRange: {from: 900, to: 0}
            datasourceUid: ddiver-prometheus
            model:
              expr: rate(ddiver_matcher_timeouts_total[10m]) > 0
              instant: true
              refId: timeouts
