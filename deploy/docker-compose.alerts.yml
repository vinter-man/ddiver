# Telegram alerts for "something is wrong but the machine is still up".
#
# Separate from the observability file on purpose: Grafana refuses to start when a contact
# point has no token, so mounting these unconditionally would mean a missing variable takes
# the dashboards down with it. Set both variables, then add this file:
#
#   ALERT_TELEGRAM_TOKEN=123456:AA...   # a SECOND BotFather bot, not the delivery one
#   ALERT_TELEGRAM_CHAT_ID=100200300
#
#   docker compose -f docker-compose.yml \
#                  -f deploy/docker-compose.observability.yml \
#                  -f deploy/docker-compose.alerts.yml up -d
#
# What this cannot do is tell you the machine died — Grafana dies with it. That is PING_URL's
# job; see "Watching it" in the README.

services:
  grafana:
    environment:
      ALERT_TELEGRAM_TOKEN: ${ALERT_TELEGRAM_TOKEN:?set it in .env, or drop this compose file}
      ALERT_TELEGRAM_CHAT_ID: ${ALERT_TELEGRAM_CHAT_ID:?set it in .env, or drop this compose file}
    volumes:
      - ./deploy/grafana/alerting:/etc/grafana/provisioning/alerting:ro
