[project]
name = "ddiver"
version = "0.1.0"
description = "Telegram keyword monitor for moderators who are not admins: a Telethon user session listens, a bot notifies."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [{ name = "vinter-man" }]
dependencies = [
  "ddiver-core",
  "telethon>=1.45,<2",
  "cryptg>=0.5",
  "aiosqlite>=0.21",
  "regex>=2024.11",
  "pydantic-settings>=2.6",
  "tzdata>=2025.1",
]

[project.scripts]
ddiver = "ddiver.__main__:main"

[dependency-groups]
dev = [
  "ddiver-core-testing",  # the shared fakes, never in the image
  "pytest>=8.3",
  "pytest-asyncio>=0.25",
  "pytest-cov>=6.0",
  "hypothesis>=6.120",
  "ruff>=0.9",
  "mypy>=1.14",
  "types-regex",
  "pytest-timeout>=2.4.0",
  "pyyaml>=6.0",          # the deployment files are checked in tests/test_packaging.py
  "types-pyyaml",
]

[tool.uv.workspace]
members = ["packages/ddiver-core", "packages/ddiver-core-testing"]

[tool.uv.sources]
ddiver-core = { workspace = true }
ddiver-core-testing = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ddiver"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["ddiver", "packages/ddiver-core/src", "packages/ddiver-core-testing/src", "tests"]

[tool.ruff.lint]
select = [
  "E", "W", "F", "I", "N", "UP", "B", "A", "C4", "SIM", "RET", "ARG", "PTH", "ERA",
  "PL", "RUF", "ASYNC", "S", "T20", "TRY", "PERF", "FURB", "LOG", "G", "DTZ", "ISC",
  "PIE", "Q", "RSE", "SLF", "TID", "TCH", "FBT", "BLE", "EM", "ICN", "INP",
]
ignore = [
  "PLR2004",  # magic values in comparisons are fine in small modules
  "PLR0911",  # early returns read better than nested branches in resolvers
  "PLR0913",  # many-argument functions are natural for wiring code
  "TRY003", "EM101", "EM102",  # exception messages inline
  "FBT001", "FBT002", "FBT003",  # boolean positional args in small internal APIs
  "TC001", "TC002", "TC003",  # TYPE_CHECKING blocks add noise for little gain here
  "ISC001",  # conflicts with the formatter
  "S311",  # random used for jitter, not crypto
  "ASYNC109",  # explicit timeout parameters are part of our API (implemented with wait_for)
  "RUF001", "RUF002", "RUF003",  # Cyrillic text is the domain of this project
]

[tool.ruff.lint.per-file-ignores]
# build_router is one long registration function on purpose: every handler is a closure over
# the same storage/matcher, and splitting it would only add indirection.
"packages/ddiver-core/src/ddiver_core/bot/handlers.py" = ["PLR0915"]
# The CLI imports heavy modules lazily so `ddiver health` does not pull in Telethon, and it
# reports configuration problems instead of raising.
"ddiver/__main__.py" = [
  "PLC0415", "BLE001", "T201", "TRY400", "TRY300", "PLR0915", "PLR0912", "ASYNC240",
]
# Telethon's decorators are untyped; the handlers themselves are typed.
"ddiver/runtime.py" = ["PLC0415"]
# The live E2E script is an operator tool: it prints, and it is meant to be read top to bottom.
"scripts/e2e_live.py" = ["T201", "E402", "PLR0915", "PLR0912", "BLE001", "S101", "INP001", "PLC0415", "ASYNC109"]
"packages/ddiver-core/src/ddiver_core/app.py" = ["BLE001"]
# Tests import lazily on purpose: some fixtures build objects the module under test
# would otherwise import at collection time.
"tests/**" = [
  "S101", "PLR2004", "ARG", "SLF001", "INP001", "PLR0915", "FBT003",
  "DTZ001", "S105", "S106", "PLC0415",
]
"packages/ddiver-core/src/ddiver_core/i18n/*.py" = ["E501"]
# InstanceLock imports fcntl only when it takes the lock, and a configuration error must be
# reported even when the error object itself is broken.
"packages/ddiver-core/src/ddiver_core/process.py" = ["PLC0415", "BLE001"]

[tool.ruff.lint.isort]
known-first-party = ["ddiver", "ddiver_core", "ddiver_core_testing"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
warn_return_any = true
disallow_any_generics = true
no_implicit_reexport = true
show_error_codes = true
pretty = true
files = ["ddiver", "packages/ddiver-core/src", "packages/ddiver-core-testing/src", "tests", "tools"]

[[tool.mypy.overrides]]
module = ["telethon", "telethon.*", "cryptg", "cryptg.*"]
ignore_missing_imports = true

# Telethon's event decorators are untyped, so mypy cannot see through @client.on(...).
[[tool.mypy.overrides]]
module = ["ddiver.runtime"]
disallow_untyped_decorators = false

[[tool.mypy.overrides]]
module = ["tests.*"]
# Telethon's event classes are untyped, and the adapter tests must subclass the real ones.
disallow_subclassing_any = false
disallow_untyped_defs = false
disallow_untyped_calls = false
disallow_untyped_decorators = false
disallow_incomplete_defs = false
check_untyped_defs = true
disable_error_code = ["arg-type", "union-attr", "attr-defined", "index", "operator"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-q --strict-markers --timeout=60"
markers = ["e2e: needs live Telegram credentials (skipped by default)"]
filterwarnings = ["error::RuntimeWarning"]

[tool.coverage.run]
source = ["ddiver", "ddiver_core"]
branch = true
omit = ["ddiver/__main__.py"]

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_covered = true
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError", "@overload"]
