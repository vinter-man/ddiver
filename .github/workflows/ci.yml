name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest  # timezone handling is case-sensitive here, unlike macOS
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --frozen
      - name: Lint
        run: uv run ruff check .
      - name: Format
        run: uv run ruff format --check .
      - name: Types
        run: uv run mypy
      - name: Tests
        run: uv run pytest -q --cov --cov-report=term-missing
      - name: Shell
        # The deploy scripts run as root on a real box, and a backtick inside double quotes
        # once turned an error message into a command substitution.
        run: shellcheck deploy/*.sh

  image:
    # A COPY that misses a workspace member breaks only the image, and nothing but the server
    # builds one. Build it here, so that deploy never ships a commit that cannot be built.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the image
        run: docker build --build-arg GIT_SHA="$GITHUB_SHA" -t ddiver:ci .
      - name: Smoke-test the image
        # A build can succeed while the installed wheels miss a module (a hatch `packages`
        # setting that drops a subpackage) or the console script is broken, and the box would
        # only find out at its healthcheck, after `up -d`. The check job tests the editable
        # install; this imports every module of both packages from site-packages, as
        # production does, makes sure nothing of the dev group came along, and runs the entry
        # point, with no network and no credentials.
        run: |
          docker run --rm --network none --entrypoint python ddiver:ci -c '
          import importlib, importlib.util, pkgutil
          import ddiver, ddiver_core
          for package in (ddiver, ddiver_core):
              for found in pkgutil.walk_packages(package.__path__, package.__name__ + "."):
                  importlib.import_module(found.name)
          dev_only = ("pytest", "ddiver_core_testing")
          shipped = [name for name in dev_only if importlib.util.find_spec(name)]
          assert not shipped, f"dev-only packages in the image: {shipped}"
          '
          docker run --rm --network none ddiver:ci --help

  deploy:
    # Only after the checks above are green, only from main, and never from a pull request —
    # a fork's PR must not be able to reach the server.
    needs: [check, image]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    concurrency:
      # Two deploys at once would race on the same git checkout on the box.
      group: deploy-production
      cancel-in-progress: false
    environment: production
    steps:
      - name: Deploy over SSH
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER: ${{ secrets.DEPLOY_USER }}
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          HOST_KEY: ${{ secrets.DEPLOY_HOST_KEY }}
        run: |
          test -n "$HOST" || { echo "DEPLOY_HOST is not set; nothing to deploy to"; exit 1; }
          install -d -m 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          # Pinned, not accept-new: the first connection is exactly the one worth protecting.
          printf '%s\n' "$HOST_KEY" > ~/.ssh/known_hosts
          # Name the commit CI actually tested. The forced command ignores what is asked for
          # and runs deploy.sh regardless; deploy.sh reads it from SSH_ORIGINAL_COMMAND and
          # accepts it only if it is a 40-hex sha that is an ancestor of origin/main. Without
          # this the box deploys whatever main is when the connection lands, which on two
          # quick pushes is the commit the second run has not finished testing.
          ssh -o BatchMode=yes -o ConnectTimeout=15 -i ~/.ssh/id_ed25519 \
              "$USER@$HOST" "$GITHUB_SHA"

